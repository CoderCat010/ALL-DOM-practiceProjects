<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Board</title>

    <!-- css files -->
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
    <div class="max-w-[1200px] mx-auto px-6 py-14">
        <!-- header part -->
        <div class="text-center mb-10">
            <h1 class="handwrite text-5xl md:text-6xl text-white drop-shadow-[2px_3px_0_rgba(0,0,0,0.25)] mb-2">The Task Board</h1>
            <p class="text-white/70 font-semibold">pinned up, sorted out</p>
        </div>

        <!-- search box -->
        <div class="flex justify-center mb-6">
            <input id="assignee-search" type="text" placeholder="🔍 search by assignee..." class="w-full max-w-[380px] font-semibold text-sm bg-[#FFF8E7] border-2 border-[#00000020] rounded-lg px-4 py-3 outline-none focus:border-[#E8B44A] shadow-[3px_3px_0_rgba(0,0,0,0.15)] placeholder:text-[#9C8A6B]">
        </div>

        <!-- filter buttons container-->
        <div id="priority-filter-container" class="flex flex-wrap justify-center gap-3 mb-12">
            <!-- data will be added dynamically -->
            <button class="handwrite text-lg px-5 py-1.5 rounded-full bg-white text-[#3D2B1F] font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">All</button>
            <button class="handwrite text-lg px-5 py-1.5 rounded-full bg-[#E8635A]/80 text-white font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">High</button>
            <button class="handwrite text-lg px-5 py-1.5 rounded-full bg-[#E8B44A]/80 text-white font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">Medium</button>
            <button class="handwrite text-lg px-5 py-1.5 rounded-full bg-[#6FA88A]/80 text-white font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">Low</button>
        </div>

        <!-- task board cards container -->
        <div id="board-container" class="grid grid-cols-3 gap-x-6">
            <!-- To Do column -->
            <div class="board-column h-fit rounded-2xl p-7">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="handwrite text-3xl text-white">To Do</h2>
                    <span id="todo-count" class="handwrite text-lg w-9 h-9 flex items-center justify-center rounded-full bg-white text-[#3D2B1F] font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">2</span>
                </div>

                <div id="todo-container" class="space-y-10">
                    <!-- data will be added dynamically -->
                </div>
            </div>

            <!-- In Progress column -->
            <div class="board-column h-fit rounded-2xl p-7">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="handwrite text-3xl text-white">In Progress</h2>
                    <span id="in-progress-count" class="handwrite text-lg w-9 h-9 flex items-center justify-center rounded-full bg-white text-[#3D2B1F] font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">1</span>
                </div>

                <div id="in-progress-container" class="space-y-10">
                    <!-- data will be added dynamically -->
                </div>
            </div>

            <!-- Done column -->
            <div class="board-column h-fit rounded-2xl p-7">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="handwrite text-3xl text-white">Done</h2>
                    <span id="done-count" class="handwrite text-lg w-9 h-9 flex items-center justify-center rounded-full bg-white text-[#3D2B1F] font-bold shadow-[2px_2px_0_rgba(0,0,0,0.2)]">1</span>
                </div>

                <div id="done-container" class="space-y-10">
                    <!-- data will be added dynamically -->
                </div>
            </div>
        </div>
    </div>


    <!-- js file -->
    <script src="./script.js"></script>
</body>
</html>
