<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Manager</title>

    <!-- css link -->
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FAFAF8] min-h-screen">

    <div class="max-w-[800px] mx-auto px-6 py-14">
        <!-- header -->
        <h1 class="heading-font text-3xl text-[#20241F] mb-8">Bookings</h1>

        <!-- status filter -->
        <div id="status-filter-container" class="flex flex-wrap items-center gap-2 mb-8">
            <!-- data will be added dynamically -->
        </div>

        <!-- bookings container -->
        <div id="bookings-container" class="space-y-3">
            <!-- data will be added dynamically -->
        </div>
    </div>


    <!-- js file -->
    <script src="./script.js"></script>
</body>
</html>
