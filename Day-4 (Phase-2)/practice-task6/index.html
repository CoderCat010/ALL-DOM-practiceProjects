<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Stock</title>

    <!-- css files -->
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-b from-[#FFF9F0] to-[#FDF3E7] min-h-screen">

    <div class="max-w-[820px] mx-auto px-6 py-16">

        <!-- header -->
        <div class="flex items-end justify-between mb-10">
            <!-- title -->
            <div>
                <p class="text-[#C77B3E] text-xs font-semibold uppercase tracking-[0.15em] mb-2">Pantry Overview</p>
                <h1 class="serif text-4xl text-[#3B2C22]">Kitchen Stock</h1>
            </div>

            <!-- description -->
            <div class="bg-white rounded-2xl shadow-sm border border-[#F0E2CE] px-5 py-3 text-center">
                <p id="low-stock-count" class="serif text-2xl text-[#C0392B]">0</p>
                <p class="text-[10px] uppercase tracking-wide text-[#9C8B78]">Low Stock</p>
            </div>
        </div>

        <!-- filter buttons -->
        <div id="filter-container" class="flex items-center gap-2 mb-8">
            <!-- data will be added dynamically -->
            <button class="bg-[#3B2C22] text-white text-sm font-medium py-2 px-5 rounded-full shadow-sm">All</button>
            <button class="bg-white text-[#6B5B4C] text-sm font-medium py-2 px-5 rounded-full border border-[#F0E2CE]">Low Stock Only</button>
        </div>

        <!-- ingredients container -->
        <div id="ingredients-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- data will be added dynamically, dummy shown below for design -->

            <div class="ingredient-card bg-white rounded-2xl border border-[#F0E2CE] shadow-sm p-5">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="serif text-xl text-[#3B2C22]">Flour</h2>
                        <p class="text-[#9C8B78] text-sm mt-0.5">5 kg</p>
                    </div>
                    <button class="delete-btn text-[#C9BBA8] hover:text-rose-400 text-sm leading-none transition">✕</button>
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 bg-[#FDF6EA] rounded-xl px-3 py-2">
                        <button class="minus-btn w-7 h-7 flex items-center justify-center rounded-lg bg-white text-[#3B2C22] shadow-sm font-semibold">−</button>
                        <span class="text-[#3B2C22] font-semibold w-6 text-center">5</span>
                        <button class="plus-btn w-7 h-7 flex items-center justify-center rounded-lg bg-white text-[#3B2C22] shadow-sm font-semibold">+</button>
                    </div>
                </div>
            </div>

            <div class="ingredient-card bg-[#FDEEEC] rounded-2xl border border-[#F5C6C0] shadow-sm p-5">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <h2 class="serif text-xl text-[#3B2C22]">Sugar</h2>
                        <p class="text-[#9C8B78] text-sm mt-0.5">1 kg</p>
                    </div>
                    <button class="delete-btn text-[#C9BBA8] hover:text-rose-400 text-sm leading-none transition">✕</button>
                </div>
                <p class="text-[#C0392B] text-xs font-semibold mb-3">⚠ Low Stock!</p>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 bg-white rounded-xl px-3 py-2">
                        <button class="minus-btn w-7 h-7 flex items-center justify-center rounded-lg bg-[#FDF6EA] text-[#3B2C22] shadow-sm font-semibold">−</button>
                        <span class="text-[#3B2C22] font-semibold w-6 text-center">1</span>
                        <button class="plus-btn w-7 h-7 flex items-center justify-center rounded-lg bg-[#FDF6EA] text-[#3B2C22] shadow-sm font-semibold">+</button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- js file -->
    <script src="./script.js"></script>
</body>
</html>
