<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Project Tracker</title>

    <!-- css file -->
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F6F3EC] min-h-screen">

    <div class="max-w-[1100px] mx-auto px-6 py-14">
        <!-- header -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-10 border-b-2 border-[#1B2430] pb-6">
            <!-- title -->
            <div>
                <p class="mono text-xs tracking-[0.25em] uppercase text-[#B8862E] mb-2">Freelance Ledger — 2026</p>
                <h1 class="text-4xl md:text-5xl font-semibold text-[#1B2430]">Project Tracker</h1>
            </div>

            <!-- display balance -->
            <div class="text-right">
                <p class="mono text-xs uppercase tracking-widest text-[#3C4A5C] mb-1">Total Budget</p>
                <p id="total-budget" class="serif text-3xl font-bold text-[#3E6B5C]">৳49,500</p>
            </div>
        </div>

        <!-- search container -->
        <div class="mb-6">
            <input id="project-search" type="text" placeholder="Search by title or client" class="w-full mono text-sm bg-white border border-[#E4DFD3] rounded-xl px-4 py-3 outline-none focus:border-[#B8862E] focus:ring-2 focus:ring-[#B8862E]/20">
        </div>

        <!-- status filter + sort container -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-10">
            <div id="status-filter-container" class="flex flex-wrap gap-2">
                <!-- data will be added dynamically -->
            </div>

            <select id="sort-select" class="mono text-xs uppercase tracking-wide bg-white border border-[#E4DFD3] rounded-full px-4 py-2 outline-none focus:border-[#B8862E]">
                <!-- data will be added dynamically -->
            </select>
        </div>

        <!-- projects collection -->
        <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- data will be added dynamically -->
        </div>
    </div>


    <!-- js file -->
    <script src="./script.js"></script>
</body>
</html>
