<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory</title>

    <!-- css link -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="max-w-[1100px] mx-auto my-[50px] bg-[#0f172a] px-6 min-h-screen">

    <!-- title -->
    <h1 class="text-3xl font-bold text-center mb-2 text-white">Product Inventory</h1>
    <p class="text-center text-slate-400 mb-8">Manage your products from stock in real time!</p>

    <!-- 
    search + total value
    -->
    <div class="flex justify-between items-center mb-6">
        <input id="search-input" type="text" placeholder="Search product..." class="bg-[#1e293b] text-white border border-[#334155] rounded-lg py-2.5 px-4 w-[280px] shadow-sm focus:outline-none focus:ring-2 focus:ring-teal-500 placeholder:text-slate-500">
        <p id="total-value" class="text-teal-400 font-bold text-lg"></p>
    </div>

    <!-- 
    category filter container 
    -->
    <div id="category-filter-container" class="flex items-center gap-x-3 mb-8">
        <!-- data will be added dynamically -->
        <button class="bg-teal-500 text-white py-1.5 px-4 text-sm font-semibold rounded-md shadow-sm">All</button>
        <button class="bg-[#1e293b] text-slate-300 py-1.5 px-4 text-sm font-semibold rounded-md border border-[#334155]">Grocery</button>
        <button class="bg-[#1e293b] text-slate-300 py-1.5 px-4 text-sm font-semibold rounded-md border border-[#334155]">Stationery</button>
    </div>

    <!-- 
    products container 
    -->
    <div id="products-container" class="grid grid-cols-3 gap-5">
        <!-- data will be added dynamically -->
    </div>

    <!-- js link -->
    <script src="./script.js"></script>
</body>
</html>
